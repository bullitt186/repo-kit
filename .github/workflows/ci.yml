name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: Lint
        run: pip install ruff==0.17.5 && ruff check scripts tests
      - run: python3 -m unittest discover -v tests
      - name: Kit is in sync with itself
        run: python3 scripts/kit.py check .
