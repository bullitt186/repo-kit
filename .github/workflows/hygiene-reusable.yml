# Reusable workflow: called by .github/workflows/pr-hygiene.yml in each repository.
name: PR hygiene (reusable)

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: PR hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: bullitt186/repo-kit
          ref: stable-v2
          path: .repo-kit
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 .repo-kit/scripts/pr_hygiene.py --base "$BASE" --labels "$LABELS" \
            --author-association "$ASSOCIATION" --body-file "$RUNNER_TEMP/pr-body.md"
